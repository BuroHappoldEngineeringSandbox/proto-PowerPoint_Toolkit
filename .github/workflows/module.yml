name: module
run-name: module ${{ github.sha }}
on:
  push:
    branches: [develop]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: module
  queue: max
jobs:
  build:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          repository: BuroHappoldEngineeringSandbox/proto-installer-mq
          ref: lock-a
          path: lockrepo
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - id: build
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          MODULE: ${{ github.event.repository.name }}
        run: |
          python lockrepo/scripts/mq.py assemble --dir lockrepo/lock --out lock-a.json
          python lockrepo/scripts/integrate.py stage --module $env:MODULE --sha $env:GITHUB_SHA --lock lock-a.json --out stage.json
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::notice::An upstream is not in the lock yet; the integrator will build this module itself."
            "status=deferred" >> $env:GITHUB_OUTPUT
            exit 0
          }
          pwsh -NoProfile -File lockrepo/scripts/build.ps1 -Module $env:MODULE -Sha $env:GITHUB_SHA -Stage stage.json -OutDir out
          $code = $LASTEXITCODE
          if ($code -ne 0) { "status=failed" >> $env:GITHUB_OUTPUT; exit 0 }
          $man = Get-Content out/manifest.json -Raw | ConvertFrom-Json
          gh release create "m-$($man.version)" "out/$env:MODULE.zip" out/manifest.json -R $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "m-$($man.version)" --notes "Module build of $env:GITHUB_SHA against proto-installer-mq lock-a. sha256 $($man.payload_sha256)"
          if ($LASTEXITCODE -ne 0) { throw "release failed" }
          "status=published" >> $env:GITHUB_OUTPUT
      - id: app
        if: always()
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.PROTO_INTEGRATOR_APP_ID }}
          private-key: ${{ secrets.PROTO_INTEGRATOR_PRIVATE_KEY }}
          owner: BuroHappoldEngineeringSandbox
          repositories: proto-installer-mq
      - name: Notify the integrator
        if: always() && steps.app.outcome == 'success'
        shell: pwsh
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          gh api repos/BuroHappoldEngineeringSandbox/proto-installer-mq/dispatches -f event_type=module -f "client_payload[module]=${{ github.event.repository.name }}" -f "client_payload[sha]=${{ github.sha }}" -f "client_payload[status]=${{ steps.build.outputs.status || 'error' }}"
          if ($LASTEXITCODE -ne 0) { throw "dispatch failed" }
      - name: Report a failed module build
        if: steps.build.outputs.status == 'failed'
        shell: pwsh
        run: |
          Write-Host "::error::This commit does not build against proto-installer-mq lock-a. The integrator decides what happens next."
          exit 1
